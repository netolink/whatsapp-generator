<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Link Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --wa: #25D366;
  --wa-dark: #128C7E;
  --wa-header: #075E54;
  --wa-chat-bg: #ECE5DD;
  --wa-bubble-out: #DCF8C6;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  color: #111;
}
body.rtl { direction: rtl; }

.page {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 2rem;
}
.header-icon {
  width: 52px; height: 52px;
  background: var(--wa);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
}
.header-icon svg { width: 28px; height: 28px; fill: #fff; }
.header h1 { font-size: 22px; font-weight: 500; color: #1a1a1a; }
.header p { font-size: 14px; color: #666; margin-top: 4px; }

/* Grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
}

/* Card */
.card {
  background: #fff;
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
}

/* Form */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #555;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.phone-row { display: flex; gap: 8px; }
.phone-row select {
  width: 148px;
  flex-shrink: 0;
  padding: 10px 8px;
  border: 1.5px solid #e5e7eb;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  background: #fafafa;
  color: #111;
  outline: none;
  cursor: pointer;
}
.phone-row input {
  flex: 1;
  min-width: 0;
}
input[type=tel], textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid #e5e7eb;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  color: #111;
  background: #fafafa;
  outline: none;
  transition: border-color 0.15s;
}
input[type=tel]:focus, textarea:focus, select:focus {
  border-color: var(--wa);
  background: #fff;
}
textarea { resize: none; height: 80px; line-height: 1.55; }
.err {
  font-size: 12px;
  color: #e53e3e;
  margin-top: 4px;
  display: none;
}
.phone-hint {
  font-size: 11px;
  color: #999;
  margin-top: 5px;
  line-height: 1.4;
}

/* Toggle */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f8f9fa;
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 16px;
  border: 1.5px solid #e5e7eb;
  gap: 10px;
}
.toggle-label { font-size: 13px; color: #555; }
.toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: #ccc;
  border-radius: 22px;
  cursor: pointer;
  transition: .2s;
}
.toggle-slider:before {
  content: "";
  position: absolute;
  width: 16px; height: 16px;
  left: 3px; top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: .2s;
}
.toggle input:checked + .toggle-slider { background: var(--wa); }
.toggle input:checked + .toggle-slider:before { transform: translateX(18px); }

/* Buttons */
.btn-wa {
  width: 100%;
  padding: 12px;
  background: var(--wa);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.15s;
  margin-bottom: 8px;
}
.btn-wa:hover { background: var(--wa-dark); }
.btn-copy {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: 1.5px solid #e5e7eb;
  border-radius: var(--radius-sm);
  color: #555;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.15s;
}
.btn-copy:hover { background: #f8f9fa; border-color: #ccc; }
.btn-wa svg, .btn-copy svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Toast */
.toast {
  text-align: center;
  font-size: 13px;
  color: var(--wa-dark);
  font-weight: 500;
  height: 0;
  overflow: hidden;
  transition: height 0.2s, padding 0.2s;
  margin-top: 0;
}
.toast.show { height: 32px; padding-top: 8px; }

/* Preview panel */
.preview-label {
  font-size: 11px;
  color: #999;
  text-align: center;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

/* Phone mockup */
.phone-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
.phone {
  background: #1c1c2e;
  border-radius: 36px;
  padding: 14px 10px;
  width: 230px;
  flex-shrink: 0;
}
.phone-notch {
  width: 60px; height: 10px;
  background: #0d0d1a;
  border-radius: 5px;
  margin: 0 auto 10px;
}
.phone-screen {
  background: var(--wa-chat-bg);
  border-radius: 24px;
  overflow: hidden;
}
.wa-bar {
  background: var(--wa-header);
  padding: 10px 12px;
  display: flex; align-items: center; gap: 9px;
}
.wa-av {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--wa);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.wa-av svg { width: 17px; height: 17px; fill: #fff; }
.wa-info { flex: 1; min-width: 0; }
.wa-num { font-size: 11px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-sub { font-size: 9px; color: #b2dfdb; }
.wa-msgs {
  padding: 10px;
  min-height: 130px;
  display: flex; flex-direction: column; gap: 6px;
  background: var(--wa-chat-bg);
}
.wa-date-lbl {
  align-self: center;
  background: rgba(255,255,255,0.65);
  border-radius: 8px;
  padding: 2px 10px;
  font-size: 9px;
  color: #667781;
  margin-bottom: 2px;
}
.bubble {
  max-width: 88%;
  padding: 7px 10px;
  font-size: 10.5px;
  line-height: 1.45;
  color: #111;
  word-break: break-word;
  white-space: pre-wrap;
}
.bubble-in {
  align-self: flex-start;
  background: #fff;
  border-radius: 0 10px 10px 10px;
}
.bubble-out {
  align-self: flex-end;
  background: var(--wa-bubble-out);
  border-radius: 10px 0 10px 10px;
  direction: ltr;
}
.bubble-out.rtl-msg { direction: rtl; }
.bubble-time {
  font-size: 8.5px;
  color: #667781;
  text-align: right;
  margin-top: 2px;
}
.wa-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 120px; gap: 6px; opacity: 0.4;
}
.wa-empty svg { width: 32px; height: 32px; fill: var(--wa); }
.wa-empty span { font-size: 10px; color: #667781; text-align: center; padding: 0 10px; }

/* Link box */
.link-box {
  background: #f8f9fa;
  border: 1.5px solid #e5e7eb;
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin-bottom: 12px;
  display: none;
}
.link-box-label { font-size: 10px; color: #999; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
.link-box-url { font-size: 10.5px; font-family: monospace; color: var(--wa-dark); word-break: break-all; direction: ltr; text-align: left; }

/* QR */
.qr-section { display: none; flex-direction: column; align-items: center; gap: 6px; }
.qr-box {
  background: #fff;
  border: 1.5px solid #e5e7eb;
  border-radius: var(--radius-sm);
  padding: 8px;
}
.qr-caption { font-size: 11px; color: #888; text-align: center; }
.qr-desc { font-size: 11px; color: #999; text-align: center; line-height: 1.5; margin-top: 2px; padding: 0 4px; }
.btn-dl { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; padding: 8px 14px; background: #f0faf4; border: 1.5px solid #25D366; border-radius: 8px; color: #128C7E; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
.btn-dl:hover { background: #d6f5e3; }

/* RTL adjustments */
body.rtl .phone-row { flex-direction: row-reverse; }
body.rtl .toggle-row { flex-direction: row-reverse; }
body.rtl .link-box-url { text-align: left; direction: ltr; }
body.rtl input[type=tel] { direction: ltr; text-align: right; }

@media (max-width: 640px) {
  .page { padding: 1rem 0.75rem 2rem; }
  .card { padding: 1.25rem; }
  .phone { width: 200px; }
  .header h1 { font-size: 18px; }
}
</style>

const DEFAULTS = { he: {d:"+972",n:"Israel"}, en: {d:"+1",n:"United States"}, ru: {d:"+7",n:"Russia"} };

let lang = 'en', link = '';

function init() {
  const params = new URLSearchParams(window.location.search);
  lang = params.get('lang') || 'en';
  if (!T[lang]) lang = 'en';

  if (lang === 'he') {
    document.body.classList.add('rtl');
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }

  buildSelect();
  applyT();
}

function buildSelect() {
  const s = document.getElementById('dial');
  s.innerHTML = COUNTRIES.map(c => `<option value="${c.d}">${c.f} ${c.d} ${c.n}</option>`).join('');
  const def = DEFAULTS[lang]; const opt = Array.from(s.options).find(o => o.value === def.d && o.text.includes(def.n)); if(opt) s.value = opt.value, s.selectedIndex = opt.index; else s.value = def.d;
  s.addEventListener('change', gen);
}

function applyT() {
  const t = T[lang];
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-subtitle').textContent = t.subtitle;
  document.getElementById('t-phone-lbl').textContent = t.phoneLbl;
  document.getElementById('t-msg-lbl').childNodes[0].textContent = t.msgLbl + ' ';
  document.getElementById('t-opt').textContent = t.opt;
  document.getElementById('t-toggle').textContent = t.toggle;
  document.getElementById('t-open').textContent = t.open;
  document.getElementById('t-copy').textContent = t.copy;
  document.getElementById('t-preview').textContent = t.preview;
  document.getElementById('t-hint').textContent = t.hint;
  document.getElementById('t-status').textContent = t.status;
  document.getElementById('t-link-lbl').textContent = t.linkLbl;
  document.getElementById('t-phone-hint').textContent = t.phoneHint || '';
  document.getElementById('t-qr').textContent = t.qr;
  document.getElementById('t-qr-desc').textContent = t.qrDesc || '';
  document.getElementById('t-dl-qr').textContent = t.dlQr || 'Download QR Code';
  document.getElementById('t-footer').textContent = t.footer.replace('{year}', new Date().getFullYear());
  document.getElementById('msg').placeholder = t.noMsg;
  if (lang === 'he') {
    document.getElementById('msg').style.direction = 'rtl';
    document.getElementById('msg').style.textAlign = 'right';
  }
}

function getNow() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function getDateLabel() {
  const locale = lang === 'he' ? 'he-IL' : lang === 'ru' ? 'ru-RU' : 'en-US';
  return new Intl.DateTimeFormat(locale, { weekday: 'long', day: 'numeric', month: 'short' }).format(new Date());
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function gen() {
  const dial = document.getElementById('dial').value;
  let phone = document.getElementById('phone').value.replace(/\D/g,'');
  const msg = document.getElementById('msg').value;
  const fullMode = document.getElementById('full-toggle').checked;
  const errEl = document.getElementById('perr');

  if (!phone) {
    link = '';
    errEl.style.display = 'none';
    document.getElementById('link-box').style.display = 'none';
    document.getElementById('qr-section').style.display = 'none';
    resetPreview();
    return;
  }

  // Israel: with leading 0 -> 9 or 10 digits total; without 0 -> 8 or 9 digits
  const isIsrael = document.getElementById('dial').value === '+972';
  let valid = false;
  if (isIsrael) {
    if (phone.startsWith('0')) {
      valid = phone.length === 9 || phone.length === 10;
    } else {
      valid = phone.length === 8 || phone.length === 9;
    }
  } else {
    valid = phone.length >= 6 && phone.length <= 15;
  }
  if (!valid) {
    errEl.style.display = 'block';
    errEl.textContent = T[lang].invalid;
    link = '';
    document.getElementById('link-box').style.display = 'none';
    document.getElementById('qr-section').style.display = 'none';
    resetPreview();
    return;
  }
  errEl.style.display = 'none';

  if (phone.startsWith('0')) phone = phone.slice(1);
  const num = dial.replace('+','') + phone;
  const displayNum = dial + ' ' + phone;
  const msgTrimmed = msg.trim();

  link = fullMode
    ? 'https://api.whatsapp.com/send?phone=' + num + (msgTrimmed ? '&text=' + encodeURIComponent(msgTrimmed) : '')
    : 'https://wa.me/' + num + (msgTrimmed ? '?text=' + encodeURIComponent(msgTrimmed) : '');

  document.getElementById('wa-num').textContent = displayNum;
  document.getElementById('link-url').textContent = link;
  document.getElementById('link-box').style.display = 'block';

  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=130x130&color=000000&bgcolor=ffffff&format=png&data=' + encodeURIComponent(link);
  const img = document.getElementById('qr-img');
  img.src = qrUrl;
  document.getElementById('qr-section').style.display = 'flex';

  const isRTL = /[\u0590-\u05FF\u0600-\u06FF]/.test(msgTrimmed);
  const time = getNow();
  const msgEl = document.getElementById('wa-msgs');
  msgEl.innerHTML =
    '<div class="wa-date-lbl">' + getDateLabel() + '</div>' +
    '<div class="bubble bubble-in"><span style="font-size:9.5px;color:#aaa;font-style:italic">' + T[lang].noMsg + '</span></div>' +
    (msgTrimmed ? '<div class="bubble bubble-out' + (isRTL ? ' rtl-msg' : '') + '">' + esc(msgTrimmed) + '<div class="bubble-time">' + time + '</div></div>' : '');
}

function resetPreview() {
  document.getElementById('wa-num').textContent = '—';
  document.getElementById('wa-msgs').innerHTML =

function doCopy() {
  if (!link) return;
  navigator.clipboard.writeText(link).then(() => {
    const t = document.getElementById('toast');
    t.textContent = T[lang].copied;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}

function doOpen() {
  if (link) window.open(link, '_blank');
}

function sanitizePhone(el) {
  // Remove anything that isn't a digit
  const pos = el.selectionStart;
  const before = el.value;
  el.value = before.replace(/[^0-9]/g, '');
  // Restore cursor position as best we can
  const diff = before.length - el.value.length;
  el.setSelectionRange(Math.max(0, pos - diff), Math.max(0, pos - diff));
}

function dlQr() {
  const img = document.getElementById('qr-img');
  if (!img.src || !img.src.includes('qrserver')) return;
  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'whatsapp-qr.png';
  a.target = '_blank';
  a.click();
}

init();
