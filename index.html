<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WhatsApp Link Generator by Netolink</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#25D366;--g2:#128C7E;--ink:#0b1f1a;--mute:#5d7068;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:#e9faf1;overflow-x:hidden;-webkit-text-size-adjust:100%}
body:before,body:after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body:before{background:radial-gradient(#25D366,#7be3b0 60%,transparent 70%);top:-18vmax;inset-inline-start:-12vmax}
body:after{background:radial-gradient(#8b7bff,#4cc9f0 60%,transparent 70%);bottom:-22vmax;inset-inline-end:-14vmax;animation-delay:-9s;opacity:.4}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.1)}}
.page{max-width:1020px;margin:0 auto;padding:28px 16px 36px}
.head{text-align:center;margin-bottom:26px}
.badge{width:60px;height:60px;border-radius:19px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#3be57f,#0f9d7a);box-shadow:0 12px 30px rgba(18,140,126,.4)}
.badge svg{width:32px;height:32px;fill:#fff}
h1{font-size:clamp(22px,4vw,30px);font-weight:600;letter-spacing:-.4px}
.sub{color:var(--mute);font-size:15px;margin-top:6px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.col{display:grid;gap:20px}
.glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,.8);border-radius:var(--r);box-shadow:0 14px 44px rgba(18,140,126,.14),inset 0 1px 0 #fff;padding:22px}
label,.lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--mute);margin:0 2px 7px}
.f{margin-bottom:18px}
.row{display:flex;gap:8px}
select,input[type=tel],textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.85);border:1.5px solid rgba(18,140,126,.15);border-radius:14px;padding:12px 14px;outline:none;transition:.2s}
select{width:44%;flex:none;cursor:pointer}
input[type=tel]{direction:ltr;text-align:start;min-width:0;letter-spacing:.3px}
textarea{resize:none;height:92px;line-height:1.55}
:is(select,input,textarea):focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(37,211,102,.18);background:#fff}
.err{display:none;color:#d6336c;font-size:12.5px;margin-top:7px}
.hint{font-size:12px;color:var(--mute);margin-top:7px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid rgba(18,140,126,.22);background:rgba(255,255,255,.7);color:var(--g2);cursor:pointer;transition:.18s}
.chip:hover{background:var(--g);color:#fff;transform:translateY(-1px)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid rgba(18,140,126,.12);margin-bottom:18px;font-size:14px;gap:10px}
.tg{position:relative;width:42px;height:24px;flex:none}.tg input{opacity:0;position:absolute;inset:0;z-index:2;cursor:pointer}
.tg i{position:absolute;inset:0;border-radius:24px;background:#c5d2cc;transition:.2s}
.tg i:before{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0003;transition:.2s}
.tg input:checked+i{background:var(--g)}.tg input:checked+i:before{inset-inline-start:21px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-weight:500;font-size:15px;padding:14px;border-radius:15px;border:0;cursor:pointer;transition:.2s}
.btn svg{width:18px;height:18px;flex:none}
.pri{color:#fff;background:linear-gradient(135deg,#2bdc72,#0f9d7a);box-shadow:0 10px 24px rgba(18,140,126,.35)}
.pri:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(18,140,126,.45)}
.sec{background:rgba(255,255,255,.8);color:var(--g2);border:1.5px solid rgba(18,140,126,.25);margin-top:10px}
.sec:hover{background:#fff;transform:translateY(-1px)}
.acts{display:flex;gap:10px}.acts .btn{flex:1;margin:0;min-width:0}
.adv{margin-top:18px}.adv summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--mute);list-style:none;display:flex;align-items:center;gap:7px;width:fit-content}
.adv summary::-webkit-details-marker{display:none}.adv summary:before{content:"\203A";font-size:18px;line-height:1;transition:.2s}
.adv[open] summary:before{transform:rotate(90deg)}html[dir=rtl] .adv summary:before{content:"\2039"}html[dir=rtl] .adv[open] summary:before{transform:rotate(-90deg)}
.adv .sw{margin:12px 0 0}
.btn:active{transform:scale(.98)}
.lnk{display:none;margin-top:16px;padding:11px 13px;border-radius:13px;background:rgba(18,140,126,.08);font:12px ui-monospace,Consolas,monospace;color:var(--g2);direction:ltr;text-align:left;word-break:break-all;animation:in .35s}
.pv{text-align:center;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.phone{width:248px;margin:0 auto;padding:10px;border-radius:42px;background:linear-gradient(145deg,#26323a,#0d1317);box-shadow:0 22px 50px rgba(0,0,0,.28),inset 0 0 0 2px #3a4750;position:relative}
.phone:before{content:"";position:absolute;top:16px;left:50%;width:62px;height:17px;margin-left:-31px;border-radius:12px;background:#05090b;z-index:3}
.scr{border-radius:33px;overflow:hidden;background:#efe7dd}
.sb{height:34px;background:#075e54}
.top{background:#075e54;color:#fff;display:flex;align-items:center;gap:9px;padding:4px 12px 11px;direction:ltr}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3be57f,#128C7E);display:grid;place-items:center;flex:none}
.av svg{width:19px;height:19px;fill:#fff}
.nm{font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:10px;opacity:.75}
.chat{min-height:218px;padding:14px 10px;display:flex;flex-direction:column;justify-content:flex-end;background-color:#efe7dd;background-image:radial-gradient(rgba(7,94,84,.07) 1.2px,transparent 1.4px);background-size:14px 14px}
.bub{align-self:flex-end;max-width:86%;background:#d9fdd3;border-radius:12px 0 12px 12px;padding:7px 9px 5px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px #0002;position:relative}
.bub:after{content:"";position:absolute;top:0;inset-inline-end:-7px;border:7px solid transparent;border-top-color:#d9fdd3;border-inline-start-color:#d9fdd3}
.bub.ph{background:rgba(255,255,255,.7);color:#8a9a93;font-style:italic;box-shadow:none}.bub.ph:after{display:none}
.bub.pop{animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
.tm{font-size:9px;color:#6a7c75;text-align:end;margin-top:2px}
.inp{height:38px;background:#f0f2f5;display:flex;align-items:center;gap:7px;padding:0 10px}
.inp i{flex:1;height:24px;border-radius:12px;background:#fff}.inp b{width:24px;height:24px;border-radius:50%;background:#128C7E}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.88)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.qrc{display:none;animation:in .45s}
.qrw{display:grid;place-items:center;margin-bottom:14px}
.qrw canvas{width:200px;height:200px;border-radius:18px;background:#fff;padding:10px;box-shadow:0 8px 26px rgba(0,0,0,.1)}
.cols{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #0002;cursor:pointer;transition:.15s;padding:0}
.dot.on{box-shadow:0 0 0 2.5px var(--g2);transform:scale(1.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}.two .btn{margin:0;font-size:14px;padding:12px 8px}
.qd{font-size:12.5px;color:var(--mute);text-align:center;margin-top:13px;line-height:1.55}
.hist{display:none}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:500;color:var(--mute)}
.hh button{font:inherit;font-size:12px;color:#d6336c;background:none;border:0;cursor:pointer}
.hl{display:flex;flex-wrap:wrap;gap:8px}
.hi{font:inherit;font-size:13px;padding:8px 13px;border-radius:13px;border:1px solid rgba(18,140,126,.18);background:rgba(255,255,255,.75);cursor:pointer;direction:ltr;transition:.18s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi:hover{border-color:var(--g);transform:translateY(-1px)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:rgba(11,31,26,.9);color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;transition:.3s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:26px;opacity:.8}
@media(max-width:820px){.grid{grid-template-columns:1fr}.glass{padding:18px}.page{padding:20px 12px 30px}.col:last-child{order:-0}}
@media(max-width:520px){.acts{flex-direction:column}}
@media(max-width:420px){.row{flex-direction:column}select{width:100%}}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}}
</style>
